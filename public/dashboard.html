<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rex API · Developer Dashboard — Usage, Keys & Playground</title>
  <meta name="description" content="The Rex API developer dashboard: monitor daily usage and quota, manage API keys, try all 80+ endpoints in the interactive playground, and create shortlinks." />
  <meta name="theme-color" content="#07090c" />
  <link rel="canonical" href="https://rex-api.com/dashboard" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Rex API" />
  <meta property="og:title" content="Rex API · Developer Dashboard — Usage, Keys & Playground" />
  <meta property="og:description" content="Monitor your daily usage and quota, manage API keys, try every endpoint in the interactive playground, and create shortlinks." />
  <meta property="og:url" content="https://rex-api.com/dashboard" />
  <meta property="og:image" content="https://rex-api.com/assets/image/og-dashboard.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Rex API · Developer Dashboard" />
  <meta name="twitter:description" content="Usage stats, API keys, an interactive endpoint playground, and shortlinks — one place to build with Rex API." />
  <link rel="icon" type="image/x-icon" href="/assets/image/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/image/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!--
    PERFORMANCE (mobile-first):
    - Local critical CSS loads first (no CDN hop for the design system).
    - Bootstrap Icons moved from a render-blocking CDN stylesheet (~250 KB
      font + CSS) to a self-hosted subset: only the 13 icons actually used
      by the dashboard are shipped in icons-subset.woff2 (~1.6 KB). The old
      full font is gone; see build_icon_subset.py to regenerate.
    - font-display: swap everywhere (icons.css + JS font families) so text
      renders immediately without waiting for the (tiny) subset font.
    - preconnect + modulepreload warm up the CDN origins Vue is fetched from,
      breaking the sequential dependency chain (HTML -> importmap -> vue).
  -->
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="modulepreload" href="https://esm.sh/vue@3.5.13/es2022/dist/vue.esm-browser.prod.mjs" crossorigin />
  <link rel="stylesheet" href="/css/dashboard.min.css" />
  <link rel="stylesheet" href="/css/icons.css" />

  <!--
    Vue 3 via import map (no build step). Pinned to a known-good version
    so a CDN-side update can't silently break the page. esm.sh serves the
    minified ESM build with proper CORS + caching headers.
  -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://esm.sh/vue@3.5.13/dist/vue.esm-browser.prod.js"
      }
    }
  </script>
</head>
<body>
  <!--
    Mount point. Vue takes over once /js/app.js loads. Fallback content
    inside #app is shown only if the module fails to load (offline or
    blocked CDN); we keep it minimal so the experience is "still works"
    rather than blank.
  -->
  <div id="app">
    <noscript>
      <main style="padding:64px 24px;font-family:system-ui;color:#e7e9ea;background:#07090c;min-height:100vh;">
        <h1>Rex API · Dashboard</h1>
        <p>The dashboard requires JavaScript. Use <a href="/docs" style="color:#1d9bf0;">/docs</a> for the static API reference, or <a href="/" style="color:#1d9bf0;">go back to the homepage</a>.</p>
      </main>
    </noscript>
  </div>
  <!-- Modules load asynchronously: they don't block page parsing or the
       first paint (only the stylesheet above is render-blocking, and it
       is the critical design system). Dashboard-only chunks (Overview,
       API Keys, Shortlinks, Try-It) are lazy-loaded on first use. -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
